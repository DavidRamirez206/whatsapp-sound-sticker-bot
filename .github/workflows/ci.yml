name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: npm ci
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t sound-sticker-bot:ci .

      - name: Media tests with the image's FFmpeg
        run: >
          docker run --rm --init --read-only --tmpfs /tmp:size=512m
          --entrypoint node -v "$PWD":/src:ro -w /src
          sound-sticker-bot:ci --test test/integration/media.test.js

      - name: Starts hardened, reports health and shows the login QR
        run: |
          docker run -d --name bot --init --read-only --tmpfs /tmp:size=512m \
            --cap-drop ALL --security-opt no-new-privileges:true sound-sticker-bot:ci
          for i in $(seq 1 30); do
            docker logs bot 2>&1 | grep -q "Scan this QR code" && break
            sleep 2
          done
          docker logs bot 2>&1 | grep -v '^[▄█▀ ]*$'
          docker logs bot 2>&1 | grep -q "Scan this QR code"
          docker exec bot node /app/scripts/healthcheck.js
          test "$(docker exec bot id -un)" = node
          docker stop bot
          docker logs bot 2>&1 | grep -q "SIGTERM received"
